name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run unit tests
        run: pytest -q

      - name: Smoke-test baseline evaluation
        run: python -m industrial_energy_management.evaluate --episodes 2 --seed 123
