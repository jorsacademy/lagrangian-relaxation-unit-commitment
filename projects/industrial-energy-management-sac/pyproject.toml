[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-energy-management-sac"
version = "0.1.0"
description = "Industrial energy management benchmark with rule-based control and Soft Actor-Critic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29,<2",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.3,<3", "torch>=2.1"]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
